<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./static/error.css">
    <link rel="stylesheet" href="../styles/error.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Erreur Spotify</title>
</head>
<body>
    <div class="body">
        <div class="main spotifyerror">
            <div class="errorcontent">
                <div class="icon">
                    <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 8.8a15 15 0 0 1 20 0"/>
                        <path d="M5 12.5a10 10 0 0 1 14 0"/>
                        <path d="M8.5 16a5 5 0 0 1 7 0"/>
                        <path d="M3 3l18 18"/>
                    </svg>
                </div>
                <span class="badge">Erreur {{error.code}} · Spotify</span>
                <h2 class="errortitle">Spotify ne répond pas</h2>
                <p class="errortext">
                    Impossible de récupérer les titres pour le moment.
                    Le serveur reste en ligne : réessaie dans quelques instants.
                </p>
                <div class="buttons">
                    <a href="" class="retry">&#8635; Réessayer</a>
                    <a href="/" class="home">Retour à l'accueil</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
